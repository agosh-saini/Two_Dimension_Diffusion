name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib opencv-python tqdm pytest pytest-cov
    
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=diffuse --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true
    
    - name: Run main script tests
      run: |
        # Test random walk simulation
        python main.py --simulation-type random_walk --molecules 1000 --movements 50 --delta-x 0.1 --delta-y 0.1
        
        # Test Fick's law simulation
        python main.py --simulation-type ficks --grid-size 30 --time-steps 169 --diffusion-coeff 0.2
        
        # Test video creation
        python main.py --simulation-type ficks --grid-size 30 --time-steps 169 --diffusion-coeff 0.2 --create-video --fps 30 